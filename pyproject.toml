[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "granite-decisions"
version = "0.1.0"
description = "Local typed decisions and calibrated classification heads for IBM Granite 4.1"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2"]

[project.optional-dependencies]
serve = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]

[project.scripts]
granite-decisions = "granite_decisions.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
